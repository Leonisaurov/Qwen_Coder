<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - {{ usuario or 'Login' }}</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.0/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .header {
            background-color: #1e1e1e;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a2a;
        }
        .header h1 { font-weight: 300; font-size: 24px; color: #fff; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .username { color: #888; font-size: 14px; }
        .username span { color: #6c5ce7; font-weight: 500; }
        .logout-btn {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid #444;
            color: #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .logout-btn:hover { border-color: #ff6b6b; color: #ff6b6b; }
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px;
            padding-bottom: 100px;
        }
        .messages {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 70vh;
            overflow-y: auto;
        }
        .message {
            background-color: #1e1e1e;
            padding: 15px 20px;
            border-radius: 12px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .message-user { color: #6c5ce7; font-weight: 500; }
        .message-time { color: #666; }
        .message-text { color: #e0e0e0; line-height: 1.5; word-wrap: break-word; }
        .system-message {
            text-align: center;
            color: #666;
            font-size: 13px;
            font-style: italic;
            padding: 10px;
        }
        .empty-state {
            text-align: center;
            color: #666;
            padding: 60px 20px;
            font-style: italic;
        }
        .input-form {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #1e1e1e;
            padding: 20px;
            border-top: 1px solid #2a2a2a;
        }
        .input-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 15px;
        }
        .input-form input {
            flex: 1;
            padding: 14px 18px;
            background-color: #2a2a2a;
            border: 1px solid #333;
            border-radius: 10px;
            color: #e0e0e0;
            font-size: 16px;
        }
        .input-form input:focus { outline: none; border-color: #6c5ce7; }
        .input-form input::placeholder { color: #666; }
        .input-form button {
            padding: 14px 28px;
            background-color: #6c5ce7;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 500;
        }
        .input-form button:hover { background-color: #5b4cdb; }
        .auth-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background-color: #1e1e1e;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
        }
        .auth-container h2 { margin-bottom: 20px; font-weight: 300; color: #fff; }
        .auth-form { display: flex; flex-direction: column; gap: 15px; }
        .auth-form input {
            padding: 14px 18px;
            background-color: #2a2a2a;
            border: 1px solid #333;
            border-radius: 10px;
            color: #e0e0e0;
            font-size: 16px;
        }
        .auth-form input:focus { outline: none; border-color: #6c5ce7; }
        .auth-form button {
            padding: 14px 28px;
            background-color: #6c5ce7;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 500;
        }
        .error-msg { color: #ff6b6b; font-size: 14px; margin-top: 10px; }
        .switch-auth {
            margin-top: 20px;
            text-align: center;
            color: #888;
            font-size: 14px;
        }
        .switch-auth a { color: #6c5ce7; text-decoration: none; cursor: pointer; }
        .messages::-webkit-scrollbar { width: 8px; }
        .messages::-webkit-scrollbar-track { background: #1a1a1a; }
        .messages::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    {% if usuario %}
    <div class="header">
        <h1>💬 Chat</h1>
        <div class="user-info">
            <span class="username">Hola, <span>{{ usuario }}</span></span>
            <button class="logout-btn" onclick="logout()">Salir</button>
        </div>
    </div>
    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="empty-state">No hay mensajes aún.<br>Sé el primero!</div>
        </div>
    </div>
    <form class="input-form" id="chatForm">
        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Escribe un mensaje..." required autocomplete="off">
            <button type="submit">Enviar</button>
        </div>
    </form>
    <script>
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const currentUser = '{{ usuario }}';
        
        // Conectar WebSocket con configuración explícita
        const socket = io({
            transports: ['websocket', 'polling'],
            reconnection: true,
            reconnectionAttempts: 5,
            reconnectionDelay: 1000
        });
        
        socket.on('connect', () => {
            console.log('✅ Conectado al servidor WebSocket');
            // Unirse a la sala global
            socket.emit('join_chat', { username: currentUser });
        });
        
        socket.on('connect_error', (error) => {
            console.error('❌ Error de conexión:', error);
        });
        
        socket.on('receive_message', (msg) => {
            console.log('📨 Mensaje recibido:', msg);
            addMessage(msg);
            scrollToBottom();
        });
        
        socket.on('system_message', (data) => {
            const sysDiv = document.createElement('div');
            sysDiv.className = 'system-message';
            sysDiv.textContent = data.text;
            messagesContainer.appendChild(sysDiv);
            scrollToBottom();
        });
        
        // Cargar mensajes históricos al iniciar
        async function loadHistoricalMessages() {
            try {
                const response = await fetch('/api/mensajes');
                const historicalMessages = await response.json();
                console.log('📜 Cargando', historicalMessages.length, 'mensajes históricos');
                historicalMessages.forEach(msg => addMessage(msg));
                scrollToBottom();
            } catch (error) {
                console.error('Error cargando mensajes históricos:', error);
            }
        }
        
        // Cargar mensajes al iniciar
        loadHistoricalMessages();
        
        document.getElementById('chatForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;
            
            console.log('📤 Enviando mensaje:', text);
            
            // Enviar vía WebSocket
            socket.emit('send_message', {
                username: currentUser,
                mensaje: text
            }, (ack) => {
                console.log('Ack:', ack);
            });
            
            messageInput.value = '';
        });

        function addMessage(msg) {
            const emptyState = messagesContainer.querySelector('.empty-state');
            if (emptyState) emptyState.remove();
            
            // Evitar duplicados usando un ID único basado en timestamp + username
            const msgId = `${msg.username}-${msg.timestamp}-${msg.mensaje}`;
            const existing = Array.from(messagesContainer.querySelectorAll('.message')).find(el => 
                el.dataset.msgId === msgId
            );
            if (existing) return;
            
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.dataset.msgId = msgId;
            msgDiv.innerHTML = '<div class="message-header"><span class="message-user">' + escapeHtml(msg.username) + '</span><span class="message-time">' + msg.timestamp + '</span></div><div class="message-text">' + escapeHtml(msg.mensaje) + '</div>';
            messagesContainer.appendChild(msgDiv);
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        async function logout() {
            window.location.href = '/logout';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
    {% else %}
    <div class="auth-container" id="loginForm">
        <h2>Iniciar Sesión</h2>
        <form class="auth-form" onsubmit="handleLogin(event)">
            <input type="text" id="loginUser" placeholder="Nombre de usuario" required>
            <input type="password" id="loginPass" placeholder="Contraseña" required>
            <button type="submit">Entrar</button>
            <div class="error-msg" id="loginError"></div>
        </form>
        <div class="switch-auth">¿No tienes cuenta? <a onclick="showRegister()">Regístrate</a></div>
    </div>
    <div class="auth-container hidden" id="registerForm">
        <h2>Registrarse</h2>
        <form class="auth-form" onsubmit="handleRegister(event)">
            <input type="text" id="regUser" placeholder="Nombre de usuario" required>
            <input type="password" id="regPass" placeholder="Contraseña" required>
            <button type="submit">Crear cuenta</button>
            <div class="error-msg" id="regError"></div>
        </form>
        <div class="switch-auth">¿Ya tienes cuenta? <a onclick="showLogin()">Inicia sesión</a></div>
    </div>
    <script>
        function showRegister() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
        }
        function showLogin() {
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
        }
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUser').value;
            const password = document.getElementById('loginPass').value;
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
                });
                if (response.ok || response.redirected) window.location.href = '/';
                else {
                    const data = await response.json();
                    document.getElementById('loginError').textContent = data.message || 'Error';
                }
            } catch (error) {
                document.getElementById('loginError').textContent = 'Error de conexión';
            }
        }
        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUser').value;
            const password = document.getElementById('regPass').value;
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
                });
                if (response.ok || response.redirected) window.location.href = '/';
                else {
                    const data = await response.json();
                    document.getElementById('regError').textContent = data.message || 'Error';
                }
            } catch (error) {
                document.getElementById('regError').textContent = 'Error de conexión';
            }
        }
    </script>
    {% endif %}
</body>
</html>
